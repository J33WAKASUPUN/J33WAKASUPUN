name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Left Top: General Stats (Stars, Commits, PRs)
      - name: General Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, repositories
          config_timezone: Asia/Colombo
          # Force Orange/Blue Theme
          extras_css: |
            h1, h2, h3, strong { color: #FF6B00 !important; }
            span, div, .field { color: #002EFF !important; }
            svg { background-color: #0d1117 !important; }

      # 2. Right Top: Top Languages (Donut Chart)
      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          # Force Orange/Blue Theme
          extras_css: |
            h1, h2, h3, strong { color: #FF6B00 !important; }
            span, div, .field { color: #002EFF !important; }
            svg { background-color: #0d1117 !important; }

      # 3. Left Bottom: Calendar/Streak (IsoCalendar)
      - name: Streak / Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # Force Orange/Blue Theme
          extras_css: |
            h1, h2, h3, strong { color: #FF6B00 !important; }
            span, div, .field { color: #002EFF !important; }
            svg { background-color: #0d1117 !important; }

      # 4. Right Bottom: Activity Graph (Wavy Lines)
      - name: Activity Graph
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: repositories, history
          # Force Orange/Blue Theme
          extras_css: |
            h1, h2, h3, strong { color: #FF6B00 !important; }
            span, div, .field { color: #002EFF !important; }
            svg { background-color: #0d1117 !important; }
