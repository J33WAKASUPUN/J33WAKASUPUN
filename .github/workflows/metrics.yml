name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (Optional) Run workflow manually
  workflow_dispatch:
  # (Optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: J33WAKASUPUN
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          
          # Enable Languages Graph
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_lines: yes
          
          # FORCE YOUR SPECIFIC COLORS
          # Background: #0d1117
          # Title (Orange): #FF6B00 
          # Text (Blue): #002EFF
          extras_css: |
            svg { background-color: #0d1117 !important; }
            h1, h2, h3, strong { color: #FF6B00 !important; }
            .field, div, span { color: #002EFF !important; }
            .stat { color: #002EFF !important; }
